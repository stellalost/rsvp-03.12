<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lost opening night </title>
<link rel="icon" href="favicon.png" type="image/png">
<style>
:root{--bg:#000;--fg:#fff;--dim:#777;--line:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:'Courier New',Courier,monospace;font-size:15px;line-height:1.6;text-transform:lowercase;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:32px 24px 96px}
.sub{text-align:center;margin:0 0 40px}
h2{font-size:15px;font-weight:400;margin:0;padding:28px 0 20px;border-top:1px solid var(--line)}
p{margin:0 0 20px}
.dim{color:var(--dim)}
label{display:block;margin:0 0 6px;color:var(--dim)}
input,textarea{width:100%;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:0;padding:12px 14px;font:inherit;text-transform:none}
input[readonly]{color:var(--dim);border-color:#444}
input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.field{margin:0 0 20px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 12px}
.row.invite{grid-template-columns:1fr 1fr auto;align-items:center}
.row.invite .btn{justify-self:start;width:auto}
.btn.small{padding:12px 16px}
input.bad{border-style:dashed}
.hint{margin:8px 0 0;font-size:13px}
.btn{background:transparent;color:var(--fg);border:1px solid var(--line);padding:14px 28px;font:inherit;font-weight:700;cursor:pointer;text-transform:lowercase}
.btn:hover{background:var(--fg);color:var(--bg)}
.btn[disabled]{opacity:.35;cursor:default;background:transparent;color:var(--fg)}
.btn.ghost{border-color:#444;font-weight:400;padding:6px 12px;font-size:13px}
.right{text-align:right}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.list{border-top:1px solid #333;margin:0 0 24px}
.item{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid #333}
.item span:last-child{color:var(--dim);white-space:nowrap}
.msg{border:1px solid var(--line);padding:14px;margin:0 0 24px}
.msg.err{border-style:dashed}
.tree{margin:0;padding:0;list-style:none}
.tree ul{list-style:none;margin:0;padding-left:22px;border-left:1px solid #333}
.node{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:8px 0}
.node:has(.num){grid-template-columns:3.2em 1fr auto}
.node .num{color:var(--dim);font-variant-numeric:tabular-nums}
.node.revoked{opacity:.35;text-decoration:line-through}
.bar{height:1px;background:#333;margin:12px 0 28px}
.bar i{display:block;height:3px;background:var(--fg);margin-top:-1px}
.dev{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #333;padding:8px 16px;font-size:12px;text-align:center}
.dev a{color:var(--dim);margin:0 8px}
@media(max-width:560px){.row,.row.invite{grid-template-columns:1fr}.node{align-items:start}}
@media(prefers-reduced-motion:no-preference){main{animation:in .5s ease both}@keyframes in{from{opacity:0}}}
</style>
</head>
<body>
<main>
  <div id="app"></div>
</main>
<div class="dev" id="dev" hidden>
  demo:
  <a href="#token=demo">first wave</a>
  <a href="#token=demo2">guest</a>
  <a href="#token=demo3">apply</a>
  <a href="#token=demo-wait">waiting</a>
  <a href="#token=demo-open">after the wait</a>
  <a href="#admin">admin</a>
</div>

<script>
/* ---------------------------------------------------------------
   config. set MOCK = false and point the api object at your
   vercel /api routes (see the fetch comments in each method).
---------------------------------------------------------------- */
const MOCK = location.protocol === 'file:' || location.search.includes('mock');
const CAPACITY = 3000;
const MAX_LEVEL = 3;          // level 1 = first wave, level 3 can't add guests
const DEFAULT_QUOTA = 3;      // how many guests a first-wave person can add
const DEFAULT_CHILD_QUOTA = 3; // how many guests each of those people can add
const ACCESS_CODE = {a:'vvip', vvip:'vvip', b:'vip', vip:'vip', c:'standard', standard:'standard'};
const accessLabel = v => ({vvip:'a', vip:'b', standard:'c'}[(v || 'standard').toLowerCase()] || 'c');
const accessOf = (v, fallback = 'standard') => {
  if(v === undefined || v === '') return fallback;
  const n = String(v).trim().toLowerCase().replace(/\s+access$/, '');
  return ACCESS_CODE[n] || null;
};

/* ---------- mock backend (in memory, resets on refresh) ---------- */
const hours = 60 * 1000;
const db = [
  {id:1,parent:null,name:'alex',email:'alex@example.com',phone:'07700 900111',status:'confirmed',level:1,quota:5,child_quota:1,access:'vip',child_access:'vip',token:'demo'},
  {id:2,parent:1,name:'sam',email:'sam@example.com',phone:'07700 900222',status:'confirmed',level:2,quota:1,child_quota:0,access:'vip',child_access:'vip',token:'demo2'},
  {id:3,parent:2,name:'jo',email:'jo@example.com',phone:'',status:'invited',level:3,quota:0,child_quota:0,access:'vip',child_access:'vip',token:'demo3'},
  {id:4,parent:1,name:'riley',email:'riley@example.com',phone:'',status:'invited',level:2,quota:1,child_quota:0,access:'vip',child_access:'vip',token:'t4'},
  {id:5,parent:1,name:'noa',email:'noa@example.com',phone:'',status:'applied',level:2,quota:1,child_quota:0,access:'vip',child_access:'vip',token:'demo-wait',release_at:new Date(Date.now()+hours).toISOString()},
  {id:6,parent:1,name:'kai',email:'kai@example.com',phone:'',status:'applied',level:2,quota:1,child_quota:0,access:'vip',child_access:'vip',token:'demo-open',release_at:new Date(Date.now()-60000).toISOString()}
];
let nextId = 10;
const wait = ms => new Promise(r => setTimeout(r, ms));
const active = () => db.filter(d => d.status !== 'revoked');
const kids = id => db.filter(d => d.parent === id);
function reservedPlaces(rows){
  const activeRows = rows.filter(r => r.status !== 'revoked');
  const used = {};
  activeRows.forEach(r => { if(r.parent != null) used[r.parent] = (used[r.parent] || 0) + 1; });
  return activeRows.reduce((total, r) => {
    if(r.level >= MAX_LEVEL) return total + 1;
    const open = Math.max(0, r.quota - (used[r.id] || 0));
    return total + 1 + open + (r.level + 1 < MAX_LEVEL ? open * (r.child_quota || 0) : 0);
  }, 0);
}
const treeSize = (quota, child) => 1 + Math.max(0, quota) + Math.max(0, quota) * Math.max(0, child);

const mockApi = {
  // GET /api/invite?token=...   (token sent in header, never logged)
  async getInvite(token){
    await wait(150);
    const me = db.find(d => d.token === token && d.status !== 'revoked');
    if(!me) throw new Error('this link is not valid or has been cancelled.');
    const due = me.release_at && new Date(me.release_at) <= new Date();
    const released = me.status === 'confirmed' ? due || !me.release_at : me.status === 'applied' && !!due;
    if(!released) return {me:{name:me.name, email:me.email, status:me.status}, children:[], remaining:0, released:false};
    if(me.status === 'applied') me.status = 'confirmed';
    const children = kids(me.id).filter(c => c.status !== 'revoked');
    const canAdd = me.level < MAX_LEVEL && me.status === 'confirmed';
    return {me, children, remaining: canAdd ? Math.max(0, me.quota - children.length) : 0, released:true, capacityLeft: CAPACITY - reservedPlaces(db)};
  },
  async apply(token, data){
    await wait(250);
    const me = db.find(d => d.token === token && d.status !== 'revoked');
    if(!me) throw new Error('this link is not valid or has been cancelled.');
    if(me.status !== 'invited') return;
    Object.assign(me, {name:data.name, status:'confirmed', applied_at:new Date().toISOString(), release_at:new Date(Date.now()+hours).toISOString()});
  },
  // POST /api/confirm  {token, name, phone}
  async confirm(token, data){
    await wait(250);
    const me = db.find(d => d.token === token && d.status !== 'revoked');
    if(!me) throw new Error('this link is not valid or has been cancelled.');
    const due = me.release_at && new Date(me.release_at) <= new Date();
    const open = me.status === 'confirmed' ? due || !me.release_at : me.status === 'applied' && !!due;
    if(!open) throw new Error(me.status === 'invited' ? 'confirm your name first.' : 'we have received your request and will get back to you.');
    Object.assign(me, {name: data.name, phone: data.phone, status: 'confirmed'});
  },
  // POST /api/guests  {token, guests:[{name,email}]}
  // server must do this in ONE transaction: check quota, level, capacity, duplicate emails
  async addGuests(token, guests){
    await wait(300);
    const me = db.find(d => d.token === token);
    const used = kids(me.id).filter(c => c.status !== 'revoked').length;
    if(me.level >= MAX_LEVEL) throw new Error('you can\'t add guests.');
    if(used + guests.length > me.quota) throw new Error('that is more guests than you have left.');
    if(reservedPlaces(db) > CAPACITY) throw new Error('the guest list is full.');
    for(const g of guests){
      if(db.some(d => d.email.toLowerCase() === g.email.toLowerCase() && d.status !== 'revoked'))
        throw new Error('already on the list');
    }
    guests.forEach(g => db.push({id:nextId++,parent:me.id,name:g.name,email:g.email,phone:'',status:'invited',level:me.level+1,quota:me.child_quota || 0,child_quota:0,access:me.access || 'standard',child_access:me.access || 'standard',token:'t'+nextId}));
  },
  // GET /api/admin/list   (behind admin auth)
  async adminList(){ await wait(150); return {rows: db.map(d => ({...d})), count: active().length}; },
  // POST /api/admin/seed  {rows:[{name,email,quota,child_quota}]}
  async adminSeed(rows){
    await wait(300);
    const dupes = rows.filter(r => db.some(d => d.email.toLowerCase() === r.email.toLowerCase() && d.status !== 'revoked'));
    if(dupes.length) throw new Error(dupes.map(r => r.email).join(', ') + ' already on the list.');
    if(reservedPlaces(db) + rows.reduce((n, r) => n + treeSize(r.quota, r.child_quota), 0) > CAPACITY)
      throw new Error('that would go over the capacity of 3000.');
    rows.forEach(r => db.push({id:nextId++,parent:null,name:r.name,email:r.email,phone:'',status:'invited',level:1,quota:r.quota,child_quota:r.child_quota,access:r.access,child_access:r.access,token:'t'+nextId}));
    return {added: rows.length, skipped: 0};
  },
  async adminClear(){ await wait(150); db.splice(0, db.length); },
  // POST /api/admin/revoke  {id}   revokes the person and their whole branch
  async adminRevoke(id){
    await wait(150);
    const walk = i => { db.find(d => d.id === i).status = 'revoked'; kids(i).forEach(c => walk(c.id)); };
    walk(id);
  }
};

/* ---------- real backend (vercel /api routes) ---------- */
const adminSecret = () => sessionStorage.getItem('s') || (sessionStorage.setItem('s', prompt('admin password') || ''), sessionStorage.getItem('s'));
async function call(path, {method = 'GET', token, admin, body} = {}){
  const headers = {'content-type': 'application/json'};
  if(token) headers.authorization = 'Bearer ' + token;
  if(admin) headers['x-admin-secret'] = adminSecret();
  const r = await fetch('/api/' + path, {method, headers, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(() => ({}));
  if(r.status === 401 && admin) sessionStorage.removeItem('s');
  if(!r.ok) throw new Error(j.error || 'something went wrong. try again.');
  return j;
}
const realApi = {
  getInvite: t => call('invite', {token: t}),
  apply: (t, d) => call('apply', {method: 'POST', token: t, body: d}),
  confirm: (t, d) => call('confirm', {method: 'POST', token: t, body: d}),
  addGuests: (t, g) => call('guests', {method: 'POST', token: t, body: {guests: g}}),
  adminList: () => call('admin/list', {admin: 1}),
  adminSeed: rows => call('admin/seed', {method: 'POST', admin: 1, body: {rows}}),
  adminRevoke: id => call('admin/revoke', {method: 'POST', admin: 1, body: {id}}),
  adminClear: () => call('admin/clear', {method: 'POST', admin: 1})
};
const api = MOCK ? mockApi : realApi;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const notice = (t, err) => `<div class="msg ${err ? 'err' : ''}" role="status">${esc(t)}</div>`;

/* ---------- guest view ---------- */
async function guestView(token){
  app.innerHTML = '<p class="sub dim">loading...</p>';
  let data;
  try { data = await api.getInvite(token); }
  catch(e){ app.innerHTML = `<p class="sub">lost</p>${notice(e.message, true)}<p class="dim">if you think this is a mistake, reply to the email you received.</p>`; return; }
  const {me, children, remaining, released} = data;
  if(!released){
    if(me.status === 'applied' || me.status === 'confirmed'){
      app.innerHTML = `
        <p class="sub">lost</p>
        <p>hi ${esc(me.name)},</p>
        <p>we have received your reply.</p>
        <p>03.12.26</p>
        <p>you will be notified shortly with next steps.</p>`;
      return;
    }
    app.innerHTML = `
      <p class="sub">lost</p>
      <p>hi ${esc(me.name)},</p>
      <p>you have been invited to the lost preview night.</p>
      <p>03.12.26</p>
      <div id="flash"></div>
      <h2>your name</h2>
      <div class="field"><label for="n">name</label><input id="n" value="${esc(me.name)}" autocomplete="name"></div>
      <div class="field"><label for="e">email</label><input id="e" value="${esc(me.email)}" readonly></div>
      <p class="right"><button class="btn" id="apply">confirm</button></p>`;
    const flash = (t, err) => { $('#flash').innerHTML = notice(t, err); window.scrollTo({top:0,behavior:'smooth'}); };
    $('#apply').onclick = async () => {
      const name = $('#n').value.trim();
      if(!name){ flash('enter your name.', true); return; }
      $('#apply').disabled = true;
      try { await api.apply(token, {name}); await guestView(token); }
      catch(e){ flash(e.message, true); $('#apply').disabled = false; }
    };
    return;
  }
  const confirmed = me.status === 'confirmed';
  const canAdd = me.level < MAX_LEVEL;

  app.innerHTML = `
    <p class="sub">lost</p>
    <p>hi ${esc(me.name)},</p>
    <p>your place is confirmed, please add your guests below.</p>
    <div id="flash"></div>

    <h2>your details</h2>
    <div class="field"><label for="n">name</label><input id="n" value="${esc(me.name)}" autocomplete="name" readonly></div>
    <div class="field"><label for="e">email</label><input id="e" value="${esc(me.email)}" readonly></div>
    <p class="right"><button class="btn" id="conf" disabled>confirmed</button></p>

    ${canAdd ? `
    <h2>your guests</h2>
    <p class="dim">adding guests is optional. you can add ${me.quota} ${me.quota === 1 ? 'guest' : 'guests'} in total. ${me.level + 1 < MAX_LEVEL && me.child_quota > 0 ? `each of them can add ${me.child_quota === 1 ? '1 guest' : me.child_quota + ' guests'}.` : `they can't add guests of their own.`} the guests you add will be ${accessLabel(me.access)}.</p>
    ${children.length ? `<div class="list">${children.map(c => `<div class="item"><span>${esc(c.name)} <span class="dim">${esc(c.email)} · ${accessLabel(c.access)}</span></span><span>${c.status}</span></div>`).join('')}</div>` : ''}
    ${confirmed && remaining > 0 ? `
      <div id="rows"></div>
      <p class="dim">${remaining} left</p>
    ` : `<p class="dim">you have used all your guest places.</p>`}
    ` : `<h2>your guests</h2><p class="dim">guest places are not available at this level. see you there.</p>`}`;

  const flash = (t, err) => { $('#flash').innerHTML = notice(t, err); window.scrollTo({top:0,behavior:'smooth'}); };

  if($('#rows')){
    const d = document.createElement('div');
    d.innerHTML = `<div class="row invite"><input id="gn" aria-label="guest name" placeholder="guest name"><input id="ge" aria-label="guest email" type="email" placeholder="guest email"><button class="btn small" id="invite" type="button">invite</button></div><p class="hint" id="guest-err" hidden></p>`;
    $('#rows').appendChild(d);
    const showErr = (input, msg) => {
      input.classList.add('bad');
      const hint = $('#guest-err');
      hint.hidden = false;
      hint.textContent = msg;
    };
    const clearErr = () => {
      $('#gn').classList.remove('bad');
      $('#ge').classList.remove('bad');
      $('#guest-err').hidden = true;
    };
    $('#gn').oninput = clearErr;
    $('#ge').oninput = clearErr;
    $('#invite').onclick = async () => {
      clearErr();
      const name = $('#gn').value.trim(), email = $('#ge').value.trim();
      if(!name){ showErr($('#gn'), 'enter a name.'); return; }
      if(!/^\S+@\S+\.\S+$/.test(email)){ showErr($('#ge'), 'enter a valid email.'); return; }
      if(children.some(c => c.email.toLowerCase() === email.toLowerCase())){ showErr($('#ge'), 'already on the list'); return; }
      $('#invite').disabled = true;
      try { await api.addGuests(token, [{name, email}]); await guestView(token); }
      catch(e){
        showErr($('#ge'), /already on the list/i.test(e.message) ? 'already on the list' : e.message);
        $('#invite').disabled = false;
      }
    };
  }
}

/* ---------- admin view ---------- */
async function adminView(){
  app.innerHTML = '<p class="sub dim">loading...</p>';
  const {rows} = await api.adminList();
  const byParent = {};
  rows.forEach(r => (byParent[r.parent ?? 'root'] ||= []).push(r));
  const render = (pid, numbered) => (byParent[pid] || []).map((r, i) => `
    <li>
      <div class="node ${r.status}">
        ${numbered ? `<span class="num">${i + 1}.</span>` : ''}<span>${esc(r.name)} <span class="dim">${accessLabel(r.access)} · ${esc(r.email)} · ${r.phone ? esc(r.phone) : 'no phone'} · ${r.status}${r.level < MAX_LEVEL ? ` · can invite ${r.quota}${r.level + 1 < MAX_LEVEL ? `, their guests can invite ${r.child_quota}` : ''}` : ''}</span></span>
        ${r.status !== 'revoked' ? `<button class="btn ghost" data-rv="${r.id}">revoke</button>` : ''}
      </div>
      ${byParent[r.id] ? `<ul>${render(r.id)}</ul>` : ''}
    </li>`).join('');
  const confirmed = rows.filter(r => r.status === 'confirmed').length;
  const reserved = reservedPlaces(rows);

  app.innerHTML = `
    <p class="sub">guest list admin</p>
    <p>${reserved} / ${CAPACITY} places <span class="dim">(${confirmed} confirmed)</span></p>
    <p class="actions"><button class="btn" id="dl">download invited and confirmed</button><button class="btn" id="clear">clear registry</button></p>
    <div class="bar"><i style="width:${Math.min(100, reserved / CAPACITY * 100)}%"></i></div>
    <div id="flash"></div>

    <h2>add first wave</h2>
    <p class="dim">one per line: name, email, how many this person can add, how many each of those guests can add, access. access is a, b or c. a is vvip, b is vip, c is standard. the people they add get the same. 0 means they can't add anyone. the first email asks them to apply. one minute after they confirm their name, they get the guest list link.</p>
    <div class="field"><textarea id="seed" rows="5" placeholder="stella, stella@gmail.com, 3, 1, a"></textarea></div>
    <p class="right"><button class="btn" id="go">send links</button></p>

    <h2>guest tree</h2>
    <ul class="tree">${render('root', true)}</ul>`;

  const places = (v, fallback) => {
    if(v === undefined || v === '') return fallback;
    const n = parseInt(v, 10);
    return Number.isFinite(n) && n >= 0 && n <= CAPACITY ? n : null;
  };
  $('#dl').onclick = () => {
    const byId = Object.fromEntries(rows.map(r => [r.id, r]));
    const cell = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replaceAll('"', '""')}"` : s; };
    const people = rows.filter(r => r.status === 'invited' || r.status === 'applied' || r.status === 'confirmed');
    const lines = [['name','access','email','phone','status','invited by','can invite','their guests can invite'],
      ...people.map(r => [r.name, accessLabel(r.access), r.email, r.phone || '', r.status, r.parent ? (byId[r.parent]?.name || '') : 'us', r.quota, r.child_quota])];
    const blob = new Blob([lines.map(line => line.map(cell).join(',')).join('\n')], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'lost-guests.csv';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  const showLines = (lines, err) => {
    $('#flash').innerHTML = `<div class="msg ${err ? 'err' : ''}" role="status">${lines.map(esc).join('<br>')}</div>`;
  };
  $('#go').onclick = async () => {
    const existing = new Set(rows.filter(r => r.status !== 'revoked').map(r => r.email.toLowerCase()));
    const seen = new Map();
    const errors = [];
    const seeded = [];
    $('#seed').value.split('\n').forEach((line, idx) => {
      const p = line.split(',').map(x => x.trim());
      if(!p[0] && !p[1]) return;
      const n = idx + 1;
      const email = (p[1] || '').toLowerCase();
      if(!p[0] || !/^\S+@\S+\.\S+$/.test(email)){ errors.push(`line ${n} needs a name and a valid email.`); return; }
      const quota = places(p[2], DEFAULT_QUOTA), child = places(p[3], DEFAULT_CHILD_QUOTA);
      const tier = accessOf(p[4]);
      let ok = true;
      if(quota === null || child === null){ errors.push(`line ${n}: guest numbers must be from 0 to ${CAPACITY}.`); ok = false; }
      if(tier === null){ errors.push(`line ${n}: access must be a, b or c.`); ok = false; }
      if(seen.has(email)){ errors.push(`line ${n}: ${email} is a duplicate of line ${seen.get(email)}.`); ok = false; }
      else seen.set(email, n);
      if(existing.has(email)){ errors.push(`line ${n}: ${email} is already on the list.`); ok = false; }
      if(ok) seeded.push({name:p[0], email, quota, child_quota: child, access: tier, child_access: tier});
    });
    if(!errors.length && !seeded.length){ showLines(['add at least one person.'], true); return; }
    if(errors.length){ showLines(errors, true); return; }
    $('#go').disabled = true;
    let added = 0;
    try {
      for(let i = 0; i < seeded.length; i += 100){
        const result = await api.adminSeed(seeded.slice(i, i + 100));
        added += result.added || 0;
        showLines([`added ${added}.`]);
      }
      await adminView();
      showLines([`added ${added}.`]);
    } catch(e){
      const sent = added ? `added ${added}. ` : '';
      try { await adminView(); } catch(_) {}
      showLines([sent + e.message], true);
    }
  };
  $('#clear').onclick = async () => {
    if(!confirm('clear the whole guest list? this cannot be undone.')) return;
    try { await api.adminClear(); adminView(); }
    catch(e){ $('#flash').innerHTML = notice(e.message, true); }
  };
  app.querySelectorAll('[data-rv]').forEach(b => b.onclick = async () => {
    if(confirm('revoke this person and everyone they invited?')){ await api.adminRevoke(+b.dataset.rv); adminView(); }
  });
}

/* ---------- router (token lives in the #fragment so it stays out of server logs) ---------- */
function route(){
  const h = location.hash.slice(1);
  if(h === 'admin') return adminView().catch(e => { app.innerHTML = notice(e.message, true); });
  const m = h.match(/^token=([\w-]+)$/);
  if(m) return guestView(m[1]);
  app.innerHTML = '<p class="sub">rsvp 03.12.16</p><p class="dim" style="text-align:center">open the personal link from your invite email.</p>';
}
addEventListener('hashchange', route);
if(MOCK) $('#dev').hidden = false;
route();
</script>
</body>
