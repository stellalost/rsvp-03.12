<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lost</title>
<style>
:root{--bg:#000;--fg:#fff;--dim:#777;--line:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:'Courier New',Courier,monospace;font-size:15px;line-height:1.6;text-transform:lowercase;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:32px 24px 96px}
.logo{text-align:center;margin:0 0 72px;line-height:0}
.logo img{width:150px;max-width:50%;height:auto}
.sub{text-align:center;margin:0 0 40px}
h2{font-size:15px;font-weight:400;margin:0;padding:28px 0 20px;border-top:1px solid var(--line)}
p{margin:0 0 20px}
.dim{color:var(--dim)}
label{display:block;margin:0 0 6px;color:var(--dim)}
input,textarea{width:100%;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:0;padding:12px 14px;font:inherit;text-transform:none}
input[readonly]{color:var(--dim);border-color:#444}
input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.field{margin:0 0 20px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 12px}
.btn{background:transparent;color:var(--fg);border:1px solid var(--line);padding:14px 28px;font:inherit;font-weight:700;cursor:pointer;text-transform:lowercase}
.btn:hover{background:var(--fg);color:var(--bg)}
.btn[disabled]{opacity:.35;cursor:default;background:transparent;color:var(--fg)}
.btn.ghost{border-color:#444;font-weight:400;padding:6px 12px;font-size:13px}
.right{text-align:right}
.list{border-top:1px solid #333;margin:0 0 24px}
.item{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid #333}
.item span:last-child{color:var(--dim);white-space:nowrap}
.msg{border:1px solid var(--line);padding:14px;margin:0 0 24px}
.msg.err{border-style:dashed}
.tree{margin:0;padding:0;list-style:none}
.tree ul{list-style:none;margin:0;padding-left:22px;border-left:1px solid #333}
.node{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0;flex-wrap:wrap}
.node.revoked{opacity:.35;text-decoration:line-through}
.bar{height:1px;background:#333;margin:12px 0 28px}
.bar i{display:block;height:3px;background:var(--fg);margin-top:-1px}
.dev{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #333;padding:8px 16px;font-size:12px;text-align:center}
.dev a{color:var(--dim);margin:0 8px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
@media(prefers-reduced-motion:no-preference){main{animation:in .5s ease both}@keyframes in{from{opacity:0}}}
</style>
</head>

<script>
/* ---------------------------------------------------------------
   config. set MOCK = false and point the api object at your
   vercel /api routes (see the fetch comments in each method).
---------------------------------------------------------------- */
const MOCK = location.protocol === 'file:' || location.search.includes('mock');
const CAPACITY = 1400;
const MAX_LEVEL = 3;          // level 1 = first wave, level 3 can't add guests
const DEFAULT_QUOTA = 3;      // per person, adding guests is optional

/* ---------- mock backend (in memory, resets on refresh) ---------- */
const db = [
  {id:1,parent:null,name:'alex',email:'alex@example.com',phone:'07700 900111',status:'confirmed',level:1,quota:3,token:'demo'},
  {id:2,parent:1,name:'sam',email:'sam@example.com',phone:'07700 900222',status:'confirmed',level:2,quota:3,token:'demo2'},
  {id:3,parent:2,name:'jo',email:'jo@example.com',phone:'',status:'invited',level:3,quota:0,token:'demo3'},
  {id:4,parent:1,name:'riley',email:'riley@example.com',phone:'',status:'invited',level:2,quota:3,token:'t4'}
];
let nextId = 10;
const wait = ms => new Promise(r => setTimeout(r, ms));
const active = () => db.filter(d => d.status !== 'revoked');
const kids = id => db.filter(d => d.parent === id);

const mockApi = {
  // GET /api/invite?token=...   (token sent in header, never logged)
  async getInvite(token){
    await wait(150);
    const me = db.find(d => d.token === token && d.status !== 'revoked');
    if(!me) throw new Error('this link is not valid or has been cancelled.');
    const children = kids(me.id).filter(c => c.status !== 'revoked');
    const canAdd = me.level < MAX_LEVEL && me.status === 'confirmed';
    return {me, children, remaining: canAdd ? Math.max(0, me.quota - children.length) : 0, capacityLeft: CAPACITY - active().length};
  },
  // POST /api/confirm  {token, name, phone}
  async confirm(token, data){
    await wait(250);
    const me = db.find(d => d.token === token);
    Object.assign(me, {name: data.name, phone: data.phone, status: 'confirmed'});
  },
  // POST /api/guests  {token, guests:[{name,email}]}
  // server must do this in ONE transaction: check quota, level, capacity, duplicate emails
  async addGuests(token, guests){
    await wait(300);
    const me = db.find(d => d.token === token);
    const used = kids(me.id).filter(c => c.status !== 'revoked').length;
    if(me.level >= MAX_LEVEL) throw new Error('you can\'t add guests.');
    if(used + guests.length > me.quota) throw new Error('that is more guests than you have left.');
    if(active().length + guests.length > CAPACITY) throw new Error('the guest list is full.');
    for(const g of guests){
      if(db.some(d => d.email.toLowerCase() === g.email.toLowerCase() && d.status !== 'revoked'))
        throw new Error(g.email + ' is already on the list.');
    }
    guests.forEach(g => db.push({id:nextId++,parent:me.id,name:g.name,email:g.email,phone:'',status:'invited',level:me.level+1,quota:DEFAULT_QUOTA,token:'t'+nextId}));
  },
  // GET /api/admin/list   (behind admin auth)
  async adminList(){ await wait(150); return {rows: db.map(d => ({...d})), count: active().length}; },
  // POST /api/admin/seed  {rows:[{name,email,quota}]}
  async adminSeed(rows){
    await wait(300);
    rows.forEach(r => { if(!db.some(d => d.email === r.email && d.status !== 'revoked'))
      db.push({id:nextId++,parent:null,name:r.name,email:r.email,phone:'',status:'invited',level:1,quota:r.quota,token:'t'+nextId}); });
  },
  // POST /api/admin/revoke  {id}   revokes the person and their whole branch
  async adminRevoke(id){
    await wait(150);
    const walk = i => { db.find(d => d.id === i).status = 'revoked'; kids(i).forEach(c => walk(c.id)); };
    walk(id);
  }
};

/* ---------- real backend (vercel /api routes) ---------- */
const adminSecret = () => sessionStorage.getItem('s') || (sessionStorage.setItem('s', prompt('admin password') || ''), sessionStorage.getItem('s'));
async function call(path, {method = 'GET', token, admin, body} = {}){
  const headers = {'content-type': 'application/json'};
  if(token) headers.authorization = 'Bearer ' + token;
  if(admin) headers['x-admin-secret'] = adminSecret();
  const r = await fetch('/api/' + path, {method, headers, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(() => ({}));
  if(r.status === 401 && admin) sessionStorage.removeItem('s');
  if(!r.ok) throw new Error(j.error || 'something went wrong. try again.');
  return j;
}
const realApi = {
  getInvite: t => call('invite', {token: t}),
  confirm: (t, d) => call('confirm', {method: 'POST', token: t, body: d}),
  addGuests: (t, g) => call('guests', {method: 'POST', token: t, body: {guests: g}}),
  adminList: () => call('admin/list', {admin: 1}),
  adminSeed: rows => call('admin/seed', {method: 'POST', admin: 1, body: {rows}}),
  adminRevoke: id => call('admin/revoke', {method: 'POST', admin: 1, body: {id}})
};
const api = MOCK ? mockApi : realApi;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const notice = (t, err) => `<div class="msg ${err ? 'err' : ''}" role="status">${esc(t)}</div>`;

/* ---------- guest view ---------- */
async function guestView(token){
  app.innerHTML = '<p class="sub dim">loading...</p>';
  let data;
  try { data = await api.getInvite(token); }
  catch(e){ app.innerHTML = `<p class="sub">circus</p>${notice(e.message, true)}<p class="dim">if you think this is a mistake, reply to the email you received.</p>`; return; }
  const {me, children, remaining} = data;
  const confirmed = me.status === 'confirmed';
  const canAdd = me.level < MAX_LEVEL;

  app.innerHTML = `
    <p class="sub">circus</p>
    <p>hi ${esc(me.name)},</p>
    <p>${confirmed ? 'you\'re confirmed for 18.12.26 &amp; 19.12.26.' : 'confirm your details to secure your place on 18.12.26 &amp; 19.12.26.'}</p>
    <div id="flash"></div>

    <h2>your details</h2>
    <div class="field"><label for="n">name</label><input id="n" value="${esc(me.name)}" autocomplete="name"></div>
    <div class="field"><label for="e">email</label><input id="e" value="${esc(me.email)}" readonly></div>
    <div class="field"><label for="p">phone number</label><input id="p" type="tel" value="${esc(me.phone)}" autocomplete="tel" placeholder="07..."></div>
    <p class="right"><button class="btn" id="conf">${confirmed ? 'update details' : 'confirm'}</button></p>

    ${canAdd ? `
    <h2>your guests</h2>
    <p class="dim">adding guests is optional. you can add ${me.quota} in total${confirmed ? '' : ' once you have confirmed'}. each guest gets their own link and can add guests of their own.</p>
    ${children.length ? `<div class="list">${children.map(c => `<div class="item"><span>${esc(c.name)} <span class="dim">${esc(c.email)}</span></span><span>${c.status}</span></div>`).join('')}</div>` : ''}
    ${confirmed && remaining > 0 ? `
      <div id="rows"></div>
      <p><button class="btn ghost" id="more">+ another guest</button> <span class="dim">${remaining} left</span></p>
      <p class="right"><button class="btn" id="send">send invites</button></p>
    ` : `<p class="dim">${confirmed ? 'you have used all your guest places.' : 'confirm your details first.'}</p>`}
    ` : `<h2>your guests</h2><p class="dim">guest places are not available at this level. see you there.</p>`}

    <p class="dim" style="margin-top:56px">*subject to licence*</p>`;

  const flash = (t, err) => { $('#flash').innerHTML = notice(t, err); window.scrollTo({top:0,behavior:'smooth'}); };

  $('#conf').onclick = async () => {
    const name = $('#n').value.trim(), phone = $('#p').value.trim();
    if(!name || phone.replace(/\D/g,'').length < 7){ flash('enter your name and a valid phone number.', true); return; }
    $('#conf').disabled = true;
    try { await api.confirm(token, {name, phone}); await guestView(token); $('#flash').innerHTML = notice('saved. you\'re confirmed.'); }
    catch(e){ flash(e.message, true); $('#conf').disabled = false; }
  };

  if($('#rows')){
    let count = 0;
    const addRow = () => {
      if(count >= remaining) return;
      count++;
      const d = document.createElement('div'); d.className = 'row';
      d.innerHTML = `<input aria-label="guest name" placeholder="guest name"><input aria-label="guest email" type="email" placeholder="guest email">`;
      $('#rows').appendChild(d);
      if(count >= remaining) $('#more').disabled = true;
    };
    addRow();
    $('#more').onclick = addRow;
    $('#send').onclick = async () => {
      const guests = [...$('#rows').children].map(r => ({name:r.children[0].value.trim(), email:r.children[1].value.trim()})).filter(g => g.name || g.email);
      if(!guests.length){ flash('add at least one guest, or skip this step.', true); return; }
      if(guests.some(g => !g.name || !/^\S+@\S+\.\S+$/.test(g.email))){ flash('each guest needs a name and a valid email.', true); return; }
      $('#send').disabled = true;
      try { await api.addGuests(token, guests); await guestView(token); $('#flash').innerHTML = notice('invites sent.'); }
      catch(e){ flash(e.message, true); $('#send').disabled = false; }
    };
  }
}

/* ---------- admin view ---------- */
async function adminView(){
  app.innerHTML = '<p class="sub dim">loading...</p>';
  const {rows, count} = await api.adminList();
  const byParent = {};
  rows.forEach(r => (byParent[r.parent ?? 'root'] ||= []).push(r));
  const render = pid => (byParent[pid] || []).map(r => `
    <li>
      <div class="node ${r.status}">
        <span>${esc(r.name)} <span class="dim">${esc(r.email)} · ${r.phone ? esc(r.phone) : 'no phone'} · ${r.status}</span></span>
        ${r.status !== 'revoked' ? `<button class="btn ghost" data-rv="${r.id}">revoke</button>` : ''}
      </div>
      ${byParent[r.id] ? `<ul>${render(r.id)}</ul>` : ''}
    </li>`).join('');
  const confirmed = rows.filter(r => r.status === 'confirmed').length;

  app.innerHTML = `
    <p class="sub">guest list admin</p>
    <p>${count} / ${CAPACITY} places used <span class="dim">(${confirmed} confirmed)</span></p>
    <div class="bar"><i style="width:${Math.min(100, count / CAPACITY * 100)}%"></i></div>
    <div id="flash"></div>

    <h2>add first wave</h2>
    <p class="dim">one per line: name, email, guests allowed (optional, default ${DEFAULT_QUOTA}).</p>
    <div class="field"><textarea id="seed" rows="5" placeholder="alex, alex@example.com, 3"></textarea></div>
    <p class="right"><button class="btn" id="go">send links</button></p>

    <h2>guest tree</h2>
    <ul class="tree">${render('root')}</ul>`;

  $('#go').onclick = async () => {
    const parsed = $('#seed').value.split('\n').map(l => l.split(',').map(x => x.trim())).filter(p => p[0] || p[1]);
    if(!parsed.length || parsed.some(p => !p[0] || !/^\S+@\S+\.\S+$/.test(p[1] || ''))){
      $('#flash').innerHTML = notice('each line needs a name and a valid email.', true); return; }
    await api.adminSeed(parsed.map(p => ({name:p[0], email:p[1], quota: parseInt(p[2]) || DEFAULT_QUOTA})));
    adminView();
  };
  app.querySelectorAll('[data-rv]').forEach(b => b.onclick = async () => {
    if(confirm('revoke this person and everyone they invited?')){ await api.adminRevoke(+b.dataset.rv); adminView(); }
  });
}

/* ---------- router (token lives in the #fragment so it stays out of server logs) ---------- */
function route(){
  const h = location.hash.slice(1);
  if(h === 'admin') return adminView().catch(e => { app.innerHTML = notice(e.message, true); });
  const m = h.match(/^token=([\w-]+)$/);
  if(m) return guestView(m[1]);
  app.innerHTML = '<p class="sub">rsvp 03.12.16</p><p class="dim" style="text-align:center">open the personal link from your invite email.</p>';
}
addEventListener('hashchange', route);
if(MOCK) $('#dev').hidden = false;
route();
</script>
